# Autoresearch Airflow umbrella chart의 실제 dev 배포 values입니다.
# Target cluster: autoresearch-503903 / autoresearch-dev-gke.

airflow:
  airflowVersion: "2.11.2"
  executor: LocalExecutor

  defaultAirflowRepository: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-airflow
  defaultAirflowTag: "slack-alerts-e526bab"

  images:
    airflow:
      repository: asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-airflow
      tag: "slack-alerts-e526bab"
      pullPolicy: IfNotPresent

  webserverSecretKey: autoresearch-airflow-dev-webserver-secret-key

  config:
    core:
      # lake_to_bigquery/dag.py의 BigQueryInsertJobOperator import는 provider
      # openlineage mixin을 거쳐 google.cloud.dataproc_v1 전체를 로딩하므로,
      # CPU가 눌린 scheduler에서 기본값 30초를 넘겨 AirflowTaskTimeout으로
      # `airflow tasks run` 프로세스가 죽는다. 그 결과 센서 태스크가 실행도
      # 못 한 채 재시도를 소진하고 DAG run이 실패한다.
      dagbag_import_timeout: "120"
      # DagFileProcessor 타임아웃은 dagbag_import_timeout보다 커야 한다.
      dag_file_processor_timeout: "150"
    logging:
      base_log_folder: /tmp/airflow/logs
      dag_processor_manager_log_location: /tmp/airflow/logs/dag_processor_manager/dag_processor_manager.log
      # #147 task 로그 GCS 원격 저장 — base_log_folder가 /tmp(비영속)라
      # 파드 재시작 시 task 로그가 소실되고 웹서버 소급 조회가 불가하던
      # 실사고 지점 해소. task 종료 시 GCSTaskHandler가 업로드하고
      # 웹서버가 GCS에서 읽는다. 버킷·scheduler GSA objectAdmin은 인프라
      # 기존재(Autoresearch-infra airflow.tf). 인증은 WI(ADC) —
      # remote_log_conn_id는 미정의 conn이면 ADC 폴백이 기본 동작.
      remote_logging: "True"
      remote_base_log_folder: gs://autoresearch-503903-autoresearch-dev-airflow-logs/task-logs
      # 참고(#147 계획 정정): 원안의 [logging] json_format은 Airflow에
      # 존재하지 않는 설정(실측 — json_format은 Elasticsearch 태스크 핸들러
      # 전용이고 GCS 핸들러와 배타). scheduler stdout JSON화는 내장 토글이
      # 없어 범위 제외, dag_id/task_id Kibana 필터는 KPO 파드 라벨
      # (kubernetes.labels.dag_id)로 이미 충족 — 이슈 코멘트 참조.
    scheduler:
      child_process_log_directory: /tmp/airflow/logs/scheduler
    webserver:
      workers: "2"
      web_server_master_timeout: "300"
      web_server_worker_timeout: "300"

  redis:
    enabled: false

  flower:
    enabled: false

  # #146 Airflow 앱 메트릭(scheduler heartbeat, DAG duration, task 실패)을
  # statsd-exporter(9102)로 노출한다. 수집 연결(ServiceMonitor)과 Grafana
  # 대시보드는 인프라 저장소 소관(SKYAHO/Autoresearch-infra#358).
  statsd:
    enabled: true
    # LimitRange 기본값(250m/256Mi) 자동 주입 방지 — exporter는 아주 작다.
    # airflow ns ResourceQuota(4CPU/8Gi) 소진 최소화(리뷰·이슈 요구).
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  triggerer:
    enabled: false

  dagProcessor:
    enabled: false

  workers:
    replicas: 0

  # metadata DB는 내장 pod PostgreSQL 대신 관리형 Cloud SQL을 사용한다.
  # 연결 URI는 운영자가 만든 k8s Secret(airflow-metadata-db, key: connection)에서 읽는다.
  # Secret 생성 절차: docs/cloud-sql-metadata.md
  postgresql:
    enabled: false

  data:
    metadataSecretName: airflow-metadata-db

  logs:
    persistence:
      enabled: false

  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: true
      repo: https://github.com/SKYAHO/Autoresearch-airflow.git
      branch: main
      rev: HEAD
      ref: main
      depth: 1
      subPath: dags
      period: 30s

  extraEnv: |
    - name: AIRFLOW_VAR_YOUTUBE_BACKFILL_SOURCE_PATH
      valueFrom:
        secretKeyRef:
          name: autoresearch-airflow-env
          key: YOUTUBE_BACKFILL_SOURCE
          optional: true

  env:
    - name: AIRFLOW__CORE__LOAD_EXAMPLES
      value: "False"
    # Cloud SQL db-f1-micro(최대 연결 ~25) 대비 연결 풀을 작게 유지한다.
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE
      value: "3"
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW
      value: "3"
    - name: AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE
      value: "1800"
    # Google provider 오퍼레이터(GCS 센서, BigQuery 오퍼레이터)가 사용하는
    # 기본 connection. 키 파일 없이 실행 파드의 Workload Identity(ADC)를
    # 사용하므로 URI에 자격 증명을 담지 않는다.
    - name: AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT
      value: "google-cloud-platform://"
    - name: AIRFLOW_VAR_YOUTUBE_LAKE_BUCKET
      value: "autoresearch-503903-autoresearch-dev-raw-data"
    - name: AIRFLOW_VAR_AUTORESEARCH_BATCH_IMAGE
      value: "asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-batch@sha256:8f2cbe7eaf030e5f5ec05044eea9b45903add758f8c734a7600c08beb234d055"
    - name: AIRFLOW_VAR_AUTORESEARCH_TRAINING_IMAGE
      value: "asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-training@sha256:ed9c2193314a271fa5c699321067e03eb3796b81d5cb41d4368a313ed8259705"
    - name: AIRFLOW_VAR_AUTORESEARCH_FEAST_IMAGE
      value: "asia-northeast3-docker.pkg.dev/autoresearch-503903/autoresearch-dev-docker/autoresearch-feast@sha256:d44ffcafdf721d64323d6d0845519fc05f13d23d85debdecf8695ae882992e74"
    - name: AIRFLOW_VAR_FEAST_CODE_ARTIFACTS_BUCKET
      value: "autoresearch-503903-code-artifacts"
    - name: AIRFLOW_VAR_FEAST_GCP_PROJECT_ID
      value: "autoresearch-503903"
    # feast_offline_store는 Feast feature 테이블 4종 전용 dataset이다.
    # raw 테이블(data_lake_*)은 아래 LAKE_TO_BQ_DATASET /
    # CTR_TRAINING_BQ_RAW_DATASET가 가리키는 data_lake_raw로 분리됐다.
    - name: AIRFLOW_VAR_FEAST_BQ_DATASET
      value: "feast_offline_store"
    - name: AIRFLOW_VAR_FEAST_BQ_LOCATION
      value: "asia-northeast3"
    - name: AIRFLOW_VAR_FEAST_GCS_REGISTRY_PATH
      value: "gs://autoresearch-503903-feast-registry/registry.db"
    - name: AIRFLOW_VAR_FEAST_GCS_STAGING_LOCATION
      value: "gs://autoresearch-503903-feast-staging/"
    - name: AIRFLOW_VAR_CTR_TRAINING_BQ_PROJECT
      value: "autoresearch-503903"
    - name: AIRFLOW_VAR_FEAST_REDIS_HOST
      value: "10.10.16.2"
    - name: AIRFLOW_VAR_FEAST_REDIS_PORT
      value: "6379"
    - name: AIRFLOW_VAR_FEAST_REDIS_CA_SECRET_ID
      value: "autoresearch-dev-redis-server-ca"
    - name: AIRFLOW_VAR_AIRFLOW_KPO_NAMESPACE
      value: "airflow"
    - name: AIRFLOW_VAR_AIRFLOW_KPO_SERVICE_ACCOUNT
      value: "autoresearch-batch"
    - name: AIRFLOW_VAR_AUTORESEARCH_API_SECRET_NAME
      value: "autoresearch-airflow-env"
    - name: AIRFLOW_VAR_YOUTUBE_TRENDING_BASE_PATH
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/data_lake/youtube_trending_kr"
    - name: AIRFLOW_VAR_YOUTUBE_BACKFILL_OUTPUT_BASE_PATH
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/data_lake/youtube_trending_kr"
    - name: AIRFLOW_VAR_YOUTUBE_TRENDING_REGION_CODE
      value: "KR"
    - name: AIRFLOW_VAR_YOUTUBE_TRENDING_MAX_RESULTS
      value: "200"
    - name: AIRFLOW_VAR_ACTION_LOG_GENERATOR
      value: "openrouter"
    - name: AIRFLOW_VAR_ACTION_LOG_MODEL_NAME
      value: "mistralai/mistral-nemo"
    - name: AIRFLOW_VAR_ACTION_LOG_YOUTUBE_BASE_PATH
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/data_lake/youtube_trending_kr"
    - name: AIRFLOW_VAR_ACTION_LOG_VIRTUAL_USERS_PATH
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/asset/virtual_user/vu_1000.parquet"
    - name: AIRFLOW_VAR_ACTION_LOG_OUTPUT_DIR
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/data_lake/action_log"
    - name: AIRFLOW_VAR_ACTION_LOG_QUARANTINE_DIR
      value: "gs://autoresearch-503903-autoresearch-dev-raw-data/data_lake/action_log_quarantine"
    - name: AIRFLOW_VAR_ACTION_LOG_CANDIDATES_PER_USER
      value: "24"
    # #135: single 모드(rerank-api) 전환 이후 fail-closed 필수값 — 기본값이
    # 없어 이 Variable이 없으면 DAG 렌더링부터 실패한다. champion 모델이
    # 바뀌면 LLM이 판단하는 click_propensity 분포 자체가 달라져 이 값도
    # 다시 맞아야 한다(고정 상수 아님) — 재계산 절차는
    # SKYAHO/Autoresearch docs/guides/action-log.md §7.7 참고.
    # 마지막 재캘리브레이션: 2026-07-26, champion=ctr-model v12,
    # 목표 CTR 2% 기준 100유저 실측 achieved_ctr 1.88%(0.4 문턱은 2.79%로
    # 과도 오버슈트라 근접값인 0.5를 채택).
    - name: AIRFLOW_VAR_ACTION_LOG_CLICK_THRESHOLD
      value: "0.5"
    - name: AIRFLOW_VAR_ACTION_LOG_PERSONALIZED_RATIO
      value: "0.7"
    - name: AIRFLOW_VAR_ACTION_LOG_POPULAR_RATIO
      value: "0.2"
    - name: AIRFLOW_VAR_ACTION_LOG_EXPLORATION_RATIO
      value: "0.1"
    - name: AIRFLOW_VAR_ACTION_LOG_SEED
      value: "42"
    - name: AIRFLOW_VAR_ACTION_LOG_MAX_CONCURRENCY
      value: "3"
    - name: AIRFLOW_VAR_ACTION_LOG_CHUNK_SIZE
      value: "24"
    - name: AIRFLOW_VAR_ACTION_LOG_MAX_QUARANTINE_RATIO
      value: "0.5"
    - name: AIRFLOW_VAR_ACTION_LOG_OPENROUTER_POOL
      value: "action_log_openrouter"
    - name: AIRFLOW_VAR_OPENROUTER_TIMEOUT_SEC
      value: "60"
    - name: AIRFLOW_VAR_OPENROUTER_MAX_RETRIES
      value: "2"
    - name: AIRFLOW_VAR_OPENROUTER_TIMEOUT_MAX_RETRIES
      value: "1"
    - name: AIRFLOW_VAR_OPENROUTER_RETRY_BACKOFF_BASE_SEC
      value: "1"
    - name: AIRFLOW_VAR_OPENROUTER_RETRY_BACKOFF_MAX_SEC
      value: "30"
    - name: AIRFLOW_VAR_OPENROUTER_ALLOW_FALLBACKS
      value: "true"
    - name: AIRFLOW_VAR_OPENROUTER_REQUIRE_PARAMETERS
      value: "true"
    # BigQuery raw dataset 분리(Autoresearch-infra) 이후 raw 테이블
    # (data_lake_youtube_trending_kr / data_lake_action_log)은
    # feast_offline_store가 아니라 data_lake_raw에 있다. 코드 기본값과 동일한
    # 값을 배포 설정에 명시해 dataset 소유 관계가 드러나게 한다.
    # lake_to_bigquery(쓰기측) 적재 대상 dataset.
    - name: AIRFLOW_VAR_LAKE_TO_BQ_DATASET
      value: "data_lake_raw"
    # ctr_model_training(읽기측) 학습 Pod에 주입되어 앱이 raw 테이블
    # dataset을 해석할 때 사용하는 값.
    - name: AIRFLOW_VAR_CTR_TRAINING_BQ_RAW_DATASET
      value: "data_lake_raw"

  scheduler:
    env:
      - name: AUTORESEARCH_AIRFLOW_ENVIRONMENT
        value: "dev"
      - name: AIRFLOW_CONN_SLACK_PIPELINE_STATUS
        valueFrom:
          secretKeyRef:
            name: airflow-slack-webhooks
            key: pipeline-status-connection
            optional: false
      - name: AIRFLOW_CONN_SLACK_ALERTS_AIRFLOW
        valueFrom:
          secretKeyRef:
            name: airflow-slack-webhooks
            key: alerts-airflow-connection
            optional: false
      - name: AIRFLOW_CONN_SLACK_MODEL_EVENTS
        valueFrom:
          secretKeyRef:
            name: airflow-slack-webhooks
            key: model-events-connection
            optional: false
      - name: AIRFLOW__SMTP__SMTP_HOST
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-host
            optional: false
      - name: AIRFLOW__SMTP__SMTP_PORT
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-port
            optional: false
      - name: AIRFLOW__SMTP__SMTP_STARTTLS
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-starttls
            optional: false
      - name: AIRFLOW__SMTP__SMTP_SSL
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-ssl
            optional: false
      - name: AIRFLOW__SMTP__SMTP_USER
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-user
            optional: false
      - name: AIRFLOW__SMTP__SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-password
            optional: false
      - name: AIRFLOW__SMTP__SMTP_MAIL_FROM
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: smtp-mail-from
            optional: false
      - name: AUTORESEARCH_AIRFLOW_ALERT_RECIPIENTS
        valueFrom:
          secretKeyRef:
            name: airflow-email-alerts
            key: alert-recipients
            optional: false
    # lake_to_bigquery_incremental의 Google provider 오퍼레이터는 LocalExecutor로
    # scheduler 파드에서 실행된다. 인프라 Terraform이 이 KSA에 대한 GSA 가장
    # 권한을 관리하므로, Helm 소유 KSA에는 GSA annotation만 선언한다.
    serviceAccount:
      annotations:
        iam.gke.io/gcp-service-account: autoresearch-dev-airflow@autoresearch-503903.iam.gserviceaccount.com
    nodeSelector:
      cloud.google.com/gke-nodepool: airflow-dev
    logGroomerSidecar:
      enabled: false
    livenessProbe:
      timeoutSeconds: 30
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 30
    # workers.replicas=0 + LocalExecutor라 DAG 파싱과 태스크 실행이 모두 이
    # 파드에서 일어난다. limit 500m에서는 provider import가 throttling으로
    # 30초를 넘겨 DagBag import timeout과 liveness probe timeout이 함께
    # 발생했다. limit은 스케줄링 비용이 없으므로 노드 allocatable(1930m)
    # 안에서 넉넉히 올리고, request는 airflow-dev 노드의 남은 예약 여유
    # (약 300m) 안에서만 올린다.
    # memory(#158/#161): 07-27 12h 태스크 종반 OOM + 07-28 재시작 67회
    # 크래시루프 실측으로 1536Mi→2560Mi, requests 1Gi(실사용 ~1GB 반영).
    # 주의(#161 사후): 같은 블록에 resources 키가 2개 존재해 YAML 중복 키
    # 규칙(후자 승)으로 #161 값이 무효화·배포가 break-glass를 되돌렸던
    # 사고의 재발 방지 — resources는 이 블록 하나만 유지할 것.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 2560Mi

  webserver:
    replicas: 2
    nodeSelector:
      cloud.google.com/gke-nodepool: airflow-dev
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    podDisruptionBudget:
      enabled: true
      config:
        maxUnavailable: 1
    service:
      type: LoadBalancer
      # 인프라 예약 IP(terraform output airflow_ilb_ip). 리터럴로 두면 프로젝트·subnet
      # 변경을 따라오지 못한다 — #404 프로젝트 이전에서 구 IP가 남아 private DNS와
      # 갈렸다(#192, infra#425). 예약 IP 재생성 시 output 값으로 다시 맞춘다.
      loadBalancerIP: "10.10.0.3"
      annotations:
        networking.gke.io/load-balancer-type: "Internal"
      ports:
        - name: airflow-ui
          port: 8080
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  component: webserver
    args:
      - bash
      - -c
      - exec airflow webserver --pid /tmp/airflow-webserver.pid
    defaultUser:
      enabled: false
    env:
      - name: GOOGLE_OAUTH_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: airflow-web-oauth
            key: GOOGLE_OAUTH_CLIENT_ID
            optional: false
      - name: GOOGLE_OAUTH_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: airflow-web-oauth
            key: GOOGLE_OAUTH_CLIENT_SECRET
            optional: false
      - name: GOOGLE_ALLOWED_EMAILS
        valueFrom:
          secretKeyRef:
            name: airflow-web-oauth
            key: GOOGLE_ALLOWED_EMAILS
            optional: false
    webserverConfig: |
      import os
      import re

      from airflow import configuration as conf
      from airflow.providers.fab.auth_manager.security_manager.override import (
          FabAirflowSecurityManagerOverride,
      )
      from flask_appbuilder.security.manager import AUTH_OAUTH

      SQLALCHEMY_DATABASE_URI = conf.get("database", "SQL_ALCHEMY_CONN")
      CSRF_ENABLED = True

      AUTH_TYPE = AUTH_OAUTH
      AUTH_USER_REGISTRATION = True
      AUTH_USER_REGISTRATION_ROLE = "Admin"
      AUTH_ROLES_SYNC_AT_LOGIN = True
      AUTH_ROLES_MAPPING = {
          "Admin": ["Admin"],
      }

      _EMAIL_PATTERN = re.compile(r"[^@\s]+@[^@\s]+\.[^@\s]+")

      def _load_google_allowed_emails():
          raw = os.environ.get("GOOGLE_ALLOWED_EMAILS", "")
          emails = {email.strip().lower() for email in raw.split(",") if email.strip()}
          if not emails:
              raise RuntimeError("GOOGLE_ALLOWED_EMAILS must not be empty")
          if any(not _EMAIL_PATTERN.fullmatch(email) for email in emails):
              raise RuntimeError("GOOGLE_ALLOWED_EMAILS contains an invalid email")
          return emails

      _GOOGLE_ALLOWED_EMAILS = _load_google_allowed_emails()

      OAUTH_PROVIDERS = [
          {
              "name": "google",
              "icon": "fa-google",
              "token_key": "access_token",
              "remote_app": {
                  "client_id": os.environ["GOOGLE_OAUTH_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_OAUTH_CLIENT_SECRET"],
                  "api_base_url": "https://www.googleapis.com/oauth2/v2/",
                  "server_metadata_url": "https://accounts.google.com/.well-known/openid-configuration",
                  "client_kwargs": {"scope": "openid email profile"},
                  "request_token_url": None,
                  "access_token_url": "https://oauth2.googleapis.com/token",
                  "authorize_url": "https://accounts.google.com/o/oauth2/v2/auth",
              },
          },
      ]

      class GoogleOAuthSecurityManager(FabAirflowSecurityManagerOverride):
          def get_oauth_user_info(self, provider, resp):
              if provider != "google":
                  return {}

              user_info = super().get_oauth_user_info(provider, resp)
              email = (user_info.get("email") or "").lower()
              if email not in _GOOGLE_ALLOWED_EMAILS:
                  return {}

              user_info["role_keys"] = ["Admin"]
              return user_info

      SECURITY_MANAGER_CLASS = GoogleOAuthSecurityManager
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 20
    readinessProbe:
      timeoutSeconds: 20
    livenessProbe:
      timeoutSeconds: 20
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  migrateDatabaseJob:
    args:
      - bash
      - -c
      - |
        airflow db migrate
        airflow sync-perm
        airflow pools set action_log_openrouter 2 "Action log OpenRouter shard fan-out"
    nodeSelector:
      cloud.google.com/gke-nodepool: airflow-dev
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  createUserJob:
    command:
      - bash
      - -c
    args:
      - |
        airflow sync-perm
    nodeSelector:
      cloud.google.com/gke-nodepool: airflow-dev
    resources:
      requests:
        cpu: 50m
