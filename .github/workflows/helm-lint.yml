name: Helm Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint YAML for duplicate keys
        # #175: 두 PR이 같은 블록의 다른 위치에 같은 키를 추가하면 git은
        # 무충돌 머지하지만 YAML 중복 키 규칙(후자 승)으로 앞 값이 조용히
        # 무효화된다(#174 사고 — scheduler resources 2560Mi 무효화·롤백).
        # helm lint는 이를 잡지 못하므로 key-duplicates 규칙만 검사한다.
        run: |
          pip install --quiet yamllint
          yamllint -d '{rules: {key-duplicates: enable}}' \
            deploy/airflow/values.yaml \
            deploy/airflow/values.example.yaml \
            deploy/airflow/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Add Airflow Helm repo
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Build chart dependencies
        run: helm dependency update deploy/airflow

      - name: Lint chart
        run: helm lint deploy/airflow

      - name: Render chart
        run: |
          helm template autoresearch-airflow deploy/airflow \
            --namespace airflow \
            --values deploy/airflow/values.example.yaml \
            >/tmp/autoresearch-airflow.yaml

      - name: Render concrete dev values
        run: |
          helm template airflow deploy/airflow \
            --namespace airflow \
            --values deploy/airflow/values.yaml \
            >/tmp/airflow-gke-dev.yaml

      - name: Verify rendered scheduler VPA contract
        shell: sh
        run: |
          set -eu
          vpa_manifest="$(awk '
            /^---[[:space:]]*$/ {
              if (printing) exit
              capture = 0
              buffer = ""
              next
            }
            printing { print; next }
            /^apiVersion:[[:space:]]*autoscaling\.k8s\.io\/v1[[:space:]]*$/ {
              capture = 1
              buffer = $0 ORS
              next
            }
            capture { buffer = buffer $0 ORS }
            capture && /^kind:[[:space:]]*VerticalPodAutoscaler[[:space:]]*$/ {
              printing = 1
              printf "%s", buffer
            }
            END { if (!printing) exit 1 }
          ' /tmp/airflow-gke-dev.yaml)"

          require() {
            printf '%s\n' "$vpa_manifest" | grep -Eq "$1" || {
              echo "::error::$2"
              exit 1
            }
          }

          require '^  name: airflow-scheduler[[:space:]]*$' 'VPA name must be airflow-scheduler'
          require '^  namespace: airflow[[:space:]]*$' 'VPA namespace must be airflow'
          require '^  targetRef:[[:space:]]*$' 'VPA targetRef is missing'
          require '^    apiVersion: apps/v1[[:space:]]*$' 'VPA targetRef apiVersion must be apps/v1'
          require '^    kind: StatefulSet[[:space:]]*$' 'VPA targetRef kind must be StatefulSet'
          require '^    name: airflow-scheduler[[:space:]]*$' 'VPA targetRef name must be airflow-scheduler'
          require '^    updateMode: "Off"[[:space:]]*$' 'VPA updateMode must be Off'
          if printf '%s\n' "$vpa_manifest" | grep -Eq \
            '^[[:space:]]*(resourcePolicy|containerPolicies|resources|selector|annotations):'; then
            echo '::error::VPA must not define resourcePolicy, containerPolicies, resources, selector, or annotations'
            exit 1
          fi
